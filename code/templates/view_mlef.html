<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View MLEF Drawing</title>
    <link rel="stylesheet" href="mlef_style.css">
    <style>
        .view-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .view-header h2 {
            margin: 0;
        }
        .drawing-preview {
            width: 100%;
            max-width: 800px;
            border: 1px solid #ccc;
            padding: 10px;
            background: #f9f9f9;
        }
        .drawing-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        .meta-row {
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .meta-row label {
            font-weight: bold;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            background: #4a90e2;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="view-container">
        <div class="view-header">
            <div>
                <h2>Saved MLEF Drawing</h2>
                <p>Case ID: {{ case_id }}</p>
            </div>
            <div class="meta-row">
                <label>Exam Date:</label> {{ exam_date }}
            </div>
        </div>

        {% if anatomical_drawing %}
            <div class="drawing-preview">
                <img src="{{ anatomical_drawing }}" alt="Saved Anatomical Drawing">
            </div>
        {% else %}
            <p>No anatomical drawing is available for this case.</p>
        {% endif %}

        <a class="back-link" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</body>
</html>
