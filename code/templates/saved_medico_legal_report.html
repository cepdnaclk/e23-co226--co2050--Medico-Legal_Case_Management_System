<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saved Medico-Legal Report</title>
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #111827;
            background: #f8fafc;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
        }
        .page-frame {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .report-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
            padding: 32px;
        }
        .report-title {
            margin: 0 0 10px;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }
        .report-date {
            margin: 0 0 24px;
            color: #475569;
            font-size: 1rem;
        }
        
        /* UPDATED: Centered container for the drawing */
        .drawing-frame {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            background: #f8fafc;
            border-radius: 18px;
            border: 1px solid #dbeafe;
            padding: 20px;
        }

        /* NEW: Layered Drawing Styles */
        .layered-drawing {
            position: relative;
            display: inline-block;
            width: 400px; /* Keeps scaling identical to the canvas width */
            max-width: 100%;
        }
        .layered-drawing .bg-image {
            display: block;
            width: 100%;
            height: auto;
            z-index: 1;
        }
        .layered-drawing .annotation-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .note {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        @media (max-width: 640px) {
            .page-frame {
                padding: 20px;
            }
            .report-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="page-frame">
        <section class="report-card">
            <header>
                <h1 class="report-title">Saved Medico-Legal Report</h1>
                <h2>{{ exam_date }}</h2>
            </header>
            
            <!-- UPDATED: Stacked Image Container -->
            <div class="drawing-frame">
                <div class="layered-drawing">
                    <!-- Bottom Layer: The Body Map Placeholder -->
                    <img src="{{ url_for('static', filename='img/body_map_placeholder.png') }}" class="bg-image" alt="Body Map Placeholder">
                    
                    <!-- Top Layer: The Transparent Doctor Annotations -->
                    <img src="{{ drawing_base64 }}" class="annotation-image" alt="Saved anatomical drawing annotations">
                </div>
            </div>
            
            <p class="note">This page displays the stored anatomical drawing for the medico-legal report. If the annotations do not appear, confirm that the stored Base64 string starts with <code>data:image/png;base64,</code>.</p>
        </section>
    </div>
</body>
</html>
